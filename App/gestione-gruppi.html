<title>Gestione gruppi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<style>
/* Layout: due viste — la conversazione (una colonna, testata fissa, console in basso) e la plancia (KPI, andamento, casi). */
:root{
  --bg:#f1f2ef; --surface:#fbfbf9; --surface-2:#e7e9e4; --fg:#16181b; --muted:#5b6066;
  --line:#d3d6d0; --line-soft:#e4e6e1; --accent:#9c5410; --accent-ink:#fff; --signal:#0e635c; --warn:#8a3312;
  --viz:#2a78d6; --track:#dfe2dc;
  --good:#0ca30c; --attesa:#fab219; --serio:#ec835a; --critico:#d03b3b;
  --font-ui:"Archivo","Helvetica Neue",Arial,sans-serif;
  --font-read:"Source Serif 4",Georgia,"Times New Roman",serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14161a; --surface:#1c1f24; --surface-2:#262a30; --fg:#e9e7e2; --muted:#9ba1a8;
  --line:#2e3238; --line-soft:#262a30; --accent:#e5962e; --accent-ink:#17181a; --signal:#4fb3a7; --warn:#e0795a;
  --viz:#3987e5; --track:#2e3238;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#14161a; --surface:#1c1f24; --surface-2:#262a30; --fg:#e9e7e2; --muted:#9ba1a8;
  --line:#2e3238; --line-soft:#262a30; --accent:#e5962e; --accent-ink:#17181a; --signal:#4fb3a7; --warn:#e0795a;
  --viz:#3987e5; --track:#2e3238;
  color-scheme:dark;
}
/* profondità: ombre a strati, un filo di luce sul bordo alto, incassatura per le piste */
:root{
  --e1:0 1px 1px rgba(28,25,20,.05), 0 2px 4px rgba(28,25,20,.045);
  --e2:0 1px 1px rgba(28,25,20,.05), 0 3px 7px rgba(28,25,20,.055), 0 9px 20px rgba(28,25,20,.05);
  --e3:0 2px 4px rgba(28,25,20,.07), 0 12px 26px rgba(28,25,20,.09), 0 28px 56px rgba(28,25,20,.09);
  --ring:inset 0 1px 0 rgba(255,255,255,.75);
  --sunk:inset 0 1px 2px rgba(28,25,20,.14), inset 0 -1px 0 rgba(255,255,255,.5);
  --lift:0 1px 2px rgba(28,25,20,.14);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --e1:0 1px 2px rgba(0,0,0,.42);
  --e2:0 2px 4px rgba(0,0,0,.45), 0 7px 16px rgba(0,0,0,.42);
  --e3:0 4px 10px rgba(0,0,0,.5), 0 20px 44px rgba(0,0,0,.52);
  --ring:inset 0 1px 0 rgba(255,255,255,.055);
  --sunk:inset 0 1px 3px rgba(0,0,0,.55), inset 0 -1px 0 rgba(255,255,255,.03);
  --lift:0 1px 3px rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{
  --e1:0 1px 2px rgba(0,0,0,.42);
  --e2:0 2px 4px rgba(0,0,0,.45), 0 7px 16px rgba(0,0,0,.42);
  --e3:0 4px 10px rgba(0,0,0,.5), 0 20px 44px rgba(0,0,0,.52);
  --ring:inset 0 1px 0 rgba(255,255,255,.055);
  --sunk:inset 0 1px 3px rgba(0,0,0,.55), inset 0 -1px 0 rgba(255,255,255,.03);
  --lift:0 1px 3px rgba(0,0,0,.5);
}

@keyframes sali{from{opacity:0;transform:translate3d(0,9px,0)}to{opacity:1;transform:none}}
@keyframes entra{from{opacity:0;transform:translate3d(0,6px,0)}to{opacity:1;transform:none}}
@keyframes suscard{from{opacity:0;transform:translate3d(0,22px,0)}to{opacity:1;transform:none}}
@keyframes cresci{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes respira{0%,100%{opacity:.45}50%{opacity:1}}
.sali{animation:sali .34s cubic-bezier(.22,.7,.26,1) both;animation-delay:calc(var(--i,0)*42ms)}
.vista-entra{animation:entra .24s cubic-bezier(.22,.7,.26,1) both}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);display:flex;flex-direction:column;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{width:100%;max-width:820px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line);
  flex:none;transition:box-shadow .2s ease}
header.staccata{box-shadow:var(--e2)}
header .wrap{padding-block:9px;display:flex;align-items:center;gap:9px}
.mark{font-weight:700;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
.mark span{display:block;font-size:9.5px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:1px}
.spacer{flex:1}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--bg);flex:none}
.seg button{appearance:none;border:0;background:transparent;color:var(--muted);font:inherit;font-size:11.5px;font-weight:600;
  padding:6px 10px;cursor:pointer;letter-spacing:.02em;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.ico{appearance:none;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;font-size:12px;font-weight:700;
  padding:6px 10px;border-radius:7px;cursor:pointer;flex:none;white-space:nowrap}
.ico:hover{border-color:var(--accent)}
.badge{display:inline-block;min-width:16px;margin-left:5px;padding:0 4px;border-radius:9px;background:var(--accent);
  color:var(--accent-ink);font-size:9.5px;font-weight:700;line-height:15px;text-align:center;vertical-align:1px}
.badge.late{background:var(--critico);color:#fff}
button:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* barra dei tasti, sempre visibile sotto la testata */
.tools{border-top:1px solid var(--line-soft);background:var(--surface)}
.tools .wrap{padding-block:7px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tools .wrap::-webkit-scrollbar{display:none}
.tools button{appearance:none;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;font-size:12px;
  font-weight:600;padding:6px 11px;border-radius:999px;cursor:pointer;flex:none;white-space:nowrap;
  box-shadow:var(--e1),var(--ring);transition:transform .14s ease, box-shadow .14s ease, border-color .14s ease}
.tools button:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:var(--e2),var(--ring)}
.tools button:active{transform:translateY(1px) scale(.98);box-shadow:var(--sunk)}
.tools button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);
  box-shadow:var(--e2), inset 0 1px 0 rgba(255,255,255,.22)}

/* guida */
.guida h1{font-family:var(--font-read);font-size:clamp(22px,5.6vw,29px);font-weight:600;letter-spacing:-.02em;line-height:1.15;
  margin:0 0 7px;text-wrap:balance}
.guida .occhio{font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:9px}
.guida .lede{font-family:var(--font-read);font-size:16px;line-height:1.55;color:var(--muted);margin:0;max-width:62ch}
.guida h2{font-family:var(--font-ui);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);margin:0 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.guida p{font-family:var(--font-read);font-size:15px;line-height:1.58;margin:0 0 .7em;max-width:64ch}
.guida p:last-child{margin-bottom:0}
.passi{counter-reset:p;display:flex;flex-direction:column;gap:13px}
.passo{display:flex;gap:12px}
.passo .n{flex:none;width:25px;height:25px;border-radius:50%;background:var(--accent);color:var(--accent-ink);
  font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.passo .c{flex:1;min-width:0}
.passo b{display:block;font-size:14px;font-weight:700;margin-bottom:2px}
.passo span{font-family:var(--font-read);font-size:14px;line-height:1.5;color:var(--muted)}
.duo{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:10px}
.box{border:1px solid var(--line);border-radius:9px;padding:11px 13px;background:var(--bg)}
.box b{display:block;font-size:12.5px;font-weight:700;margin-bottom:4px}
.box p{font-size:13.5px;line-height:1.5;color:var(--muted);margin:0}
.warnbox{border-left:3px solid var(--critico);border-radius:0;background:transparent;border-top:0;border-right:0;border-bottom:0;padding:2px 0 2px 12px}
.warnbox b{color:var(--fg)}
.fam{font-size:10px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--accent);margin:16px 0 7px}
.fam:first-of-type{margin-top:0}
details.mod{border:1px solid var(--line);border-radius:10px;background:var(--bg);margin-bottom:6px;
  box-shadow:var(--e1),var(--ring);transition:box-shadow .18s ease}
details.mod:hover,details.mod[open]{box-shadow:var(--e2),var(--ring)}
details.mod[open] .inner{animation:entra .22s ease both}
details.mod>summary::after{transition:transform .2s ease}
details.mod[open]>summary::after{transform:rotate(180deg)}
details.mod>summary{cursor:pointer;padding:10px 12px;list-style:none;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
details.mod>summary::-webkit-details-marker{display:none}
details.mod>summary b{font-size:14px;font-weight:700}
details.mod>summary i{font-style:normal;font-size:11px;color:var(--muted);letter-spacing:.03em}
details.mod>summary::after{content:"+";margin-left:auto;color:var(--muted);font-weight:700;font-size:15px;line-height:1}
details.mod[open]>summary::after{content:"\2212"}
details.mod .inner{padding:0 12px 12px;border-top:1px solid var(--line-soft);margin-top:2px;padding-top:10px}
details.mod .inner dl{margin:0}
details.mod .inner dt{font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:9px}
details.mod .inner dt:first-child{margin-top:0}
details.mod .inner dd{margin:3px 0 0;font-family:var(--font-read);font-size:14px;line-height:1.52}
details.mod .inner dd.err{font-family:var(--font-ui);font-size:13px;line-height:1.45;border-left:2px solid var(--critico);padding-left:10px}

main{flex:1;overflow-y:auto;overscroll-behavior:contain}
main .wrap{padding-block:16px 10px;display:flex;flex-direction:column;gap:16px}
.num{font-variant-numeric:tabular-nums}

/* ---------- stati: pastiglia con puntino + parola, mai colore da solo ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:2px 9px 2px 7px;
  font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:2px;flex:none}
.st-aperto .dot{background:var(--serio)} .st-aperto{border-color:var(--serio)}
.st-corso .dot{background:var(--attesa)} .st-corso{border-color:var(--attesa)}
.st-risolto .dot{background:var(--good)} .st-risolto{border-color:var(--good)}
.st-scaduto .dot{background:var(--critico)} .st-scaduto{border-color:var(--critico)}

/* ---------- plancia ---------- */
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:9px;perspective:900px}
.tile{border:1px solid var(--line);border-radius:11px;background:var(--surface);padding:11px 12px;
  box-shadow:var(--e1),var(--ring);transform-style:preserve-3d;
  transition:box-shadow .2s ease, transform .2s cubic-bezier(.22,.7,.26,1)}
.tile.sollevata{box-shadow:var(--e3),var(--ring)}
.tile .k{font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.tile .v{font-size:27px;font-weight:700;line-height:1;letter-spacing:-.02em}
.tile .u{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.3}

.panel{border:1px solid var(--line);border-radius:11px;background:var(--surface);overflow:hidden;
  box-shadow:var(--e2),var(--ring)}
.panel>.ph{padding:11px 13px 9px;border-bottom:1px solid var(--line-soft)}
.panel>.ph h2{font-family:var(--font-read);font-size:16px;font-weight:600;margin:0;letter-spacing:-.01em}
.panel>.ph p{font-size:11.5px;color:var(--muted);margin:3px 0 0;line-height:1.4}
.panel>.pb{padding:13px}

.score{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;position:relative;isolation:isolate}
.score::before{content:"";position:absolute;z-index:-1;left:-14px;top:-18px;width:190px;height:150px;pointer-events:none;
  background:radial-gradient(60% 55% at 32% 42%, color-mix(in oklab, var(--accent) 22%, transparent), transparent 72%)}
.score .big{font-size:46px;font-weight:700;line-height:.92;letter-spacing:-.03em;font-family:var(--font-ui);
  text-shadow:0 1px 0 rgba(255,255,255,.5), 0 2px 7px rgba(28,25,20,.14)}
:root[data-theme="dark"] .score .big{text-shadow:0 1px 0 rgba(255,255,255,.07), 0 3px 12px rgba(0,0,0,.6)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .score .big{
  text-shadow:0 1px 0 rgba(255,255,255,.07), 0 3px 12px rgba(0,0,0,.6)}}
.score .big i{font-style:normal;font-size:20px;font-weight:600;color:var(--muted);margin-left:2px;text-shadow:none}
.score .leg{font-size:12px;color:var(--muted);line-height:1.45;flex:1;min-width:150px}
.meter{height:9px;border-radius:5px;background:var(--track);overflow:hidden;margin-top:11px;box-shadow:var(--sunk)}
.meter i{display:block;height:100%;border-radius:5px;width:0;
  background:linear-gradient(180deg, color-mix(in oklab, var(--viz) 82%, white), var(--viz));
  box-shadow:var(--lift), inset 0 1px 0 rgba(255,255,255,.3);
  transition:width .7s cubic-bezier(.22,.7,.26,1)}

.caso{border-top:1px solid var(--line-soft);padding:13px;transform-style:preserve-3d;
  transition:transform .22s cubic-bezier(.22,.7,.26,1), box-shadow .22s ease}
.caso:first-child{border-top:0}
.caso.sollevata{box-shadow:var(--e2);border-radius:10px;position:relative;z-index:1;background:var(--surface)}
.caso .ct{display:flex;align-items:flex-start;gap:9px;flex-wrap:wrap;margin-bottom:10px}
.caso .ct b{font-family:var(--font-read);font-size:16px;font-weight:600;letter-spacing:-.01em;flex:1;min-width:0}
.caso .cd{font-family:var(--font-read);font-size:13.5px;line-height:1.5;color:var(--muted);margin:0 0 11px}
.caso .u{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.35}

.lab{font-size:9px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:12px}

/* Tuckman: cinque passi, quello corrente marcato */
.steps{display:flex;gap:3px;margin-bottom:5px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--track);box-shadow:var(--sunk);
  transition:transform .3s cubic-bezier(.22,.7,.26,1), background .3s ease}
.steps i.on{background:var(--viz);box-shadow:var(--lift)}
.steps i.cur{background:var(--accent);height:7px;margin:-1px 0;border-radius:4px;
  box-shadow:var(--e1), 0 0 0 3px color-mix(in oklab, var(--accent) 18%, transparent)}
.stepn{font-size:12.5px;font-weight:600}
.stepn em{font-style:normal;font-weight:400;color:var(--muted)}

/* sicurezza psicologica: tre tacche + parola */
.sic{display:flex;align-items:center;gap:8px}
.sic .bars{display:flex;gap:3px}
.sic .bars i{width:16px;height:9px;border-radius:2px;background:var(--track)}
.sic.bassa .bars i:nth-child(1){background:var(--critico)}
.sic.media .bars i:nth-child(1),.sic.media .bars i:nth-child(2){background:var(--attesa)}
.sic.alta .bars i{background:var(--good)}
.sic span{font-size:12.5px;font-weight:600}

/* SCARF */
.scarf{display:flex;flex-wrap:wrap;gap:5px}
.scarf b{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:6px;padding:3px 7px;
  font-size:10.5px;font-weight:600;letter-spacing:.02em;color:var(--muted)}
.scarf b.hot{border-color:var(--critico);color:var(--fg)}
.scarf b .dot{background:var(--track)}
.scarf b.hot .dot{background:var(--critico)}

.prog{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--muted)}
.prog .meter{flex:1;margin-top:0}
.caso .row{margin-top:11px}

/* grafico */
.chartwrap{position:relative}
.chartwrap.statico .bar,.chartwrap.statico .barOmbra{animation:none}
.annulla{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:30;
  background:var(--fg);color:var(--bg);border-radius:10px;padding:9px 13px;display:flex;align-items:center;gap:13px;
  font-size:12.5px;font-weight:600;box-shadow:var(--e3);animation:suscard .22s ease both;max-width:min(94vw,430px)}
.annulla span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.annulla button{appearance:none;border:0;background:transparent;color:var(--bg);font:inherit;font-weight:700;
  text-decoration:underline;cursor:pointer;padding:0;flex:none}
.avviso{border-left:2px solid var(--attesa);padding-left:11px;font-size:12px;color:var(--muted);line-height:1.45}
svg.chart{display:block;width:100%;height:auto}
.gl{stroke:var(--line-soft);stroke-width:1}
.bar{fill:url(#gBar);transform-box:fill-box;transform-origin:bottom;
  animation:cresci .55s cubic-bezier(.22,.7,.26,1) both;animation-delay:calc(var(--i,0)*45ms)}
.barOmbra{fill:rgba(28,25,20,.1);transform-box:fill-box;transform-origin:bottom;
  animation:cresci .55s cubic-bezier(.22,.7,.26,1) both;animation-delay:calc(var(--i,0)*45ms)}
:root[data-theme="dark"] .barOmbra{fill:rgba(0,0,0,.45)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .barOmbra{fill:rgba(0,0,0,.45)}}
.tick{fill:var(--muted);font-size:9.5px;font-family:var(--font-ui);letter-spacing:.04em}
.vlab{fill:var(--fg);font-size:10.5px;font-weight:700;font-family:var(--font-ui)}
.tip{position:absolute;pointer-events:none;background:var(--fg);color:var(--bg);font-size:11px;font-weight:600;
  padding:5px 8px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-130%);opacity:0;transition:opacity .1s}
.hit{fill:transparent;cursor:default}
table.data{border-collapse:collapse;font-size:12px;width:100%}
table.data th,table.data td{border:1px solid var(--line-soft);padding:5px 8px;text-align:left}
table.data th{background:var(--surface-2);font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
table.data td.n{text-align:right;font-variant-numeric:tabular-nums}
.tbtn{appearance:none;border:0;background:transparent;color:var(--accent);font:inherit;font-size:11px;font-weight:700;
  padding:0;cursor:pointer;margin-top:9px}

/* ---------- conversazione ---------- */
.resume{border:1px solid var(--line);border-left:3px solid var(--signal);border-radius:9px;padding:10px 12px;background:var(--surface)}
.resume p{margin:0 0 8px;font-size:13px;line-height:1.45;color:var(--muted)}
.imp{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-bottom:1px solid var(--line-soft)}
.imp:last-child{border-bottom:0}
.imp .tick2{appearance:none;flex:none;width:19px;height:19px;margin-top:1px;border:1.5px solid var(--line);border-radius:5px;
  background:transparent;cursor:pointer;color:var(--good);font-size:12px;font-weight:700;line-height:16px;padding:0}
.imp .tick2:hover{border-color:var(--good)}
.imp .tx{flex:1;min-width:0;font-size:13.5px;line-height:1.4}
.imp .me{display:block;margin-top:2px;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.imp .me.late{color:var(--critico);font-weight:700}
.imp .x{appearance:none;border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:15px;line-height:1;padding:0 2px;flex:none}

.intro h1{font-family:var(--font-read);font-weight:600;font-size:clamp(21px,5.4vw,27px);line-height:1.2;margin:0 0 8px;
  text-wrap:balance;letter-spacing:-.015em}
.intro p{font-family:var(--font-read);font-size:15.5px;line-height:1.55;color:var(--muted);margin:0 0 4px;max-width:58ch}

/* conta fino a un numero, invece di comparire */
function conta(nodo,fino,anima){
  if(fermo||anima===false||fino<=0){ nodo.textContent=String(fino); return; }
  var dur=Math.min(900,420+fino*14), t0=null;
  function passo(t){
    if(t0===null)t0=t;
    var p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,3);
    nodo.textContent=String(Math.round(fino*e));
    if(p<1)requestAnimationFrame(passo); else nodo.textContent=String(fino);
  }
  nodo.textContent="0"; requestAnimationFrame(passo);
}
/* riempi una pista dopo l'inserimento, cosi' la transizione parte */
function riempi(barra,perc,anima){
  if(fermo||anima===false){ barra.style.transition="none"; barra.style.width=perc+"%"; return; }

/* inclinazione al puntatore: solo mouse, mai al tocco, mai con movimento ridotto */
function inclina(nodo,gradi){
  if(fermo||!puntatoreFine)return;
  var g=gradi||4;
  nodo.addEventListener("pointermove",function(ev){
    if(ev.pointerType!=="mouse")return;
    var r=nodo.getBoundingClientRect();
    var x=(ev.clientX-r.left)/r.width-.5, y=(ev.clientY-r.top)/r.height-.5;
    nodo.style.transform="perspective(900px) rotateY("+(x*g).toFixed(2)+"deg) rotateX("+(-y*g).toFixed(2)+"deg) translateZ(6px)";
    nodo.classList.add("sollevata");
  });
  nodo.addEventListener("pointerleave",function(){
    nodo.style.transform=""; nodo.classList.remove("sollevata");
  });
}

function dataIt(s){ if(!s)return ""; try{var p=String(s).slice(0,10).split("-");
  return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString("it-IT",{day:"2-digit",month:"short"});}catch(e){return String(s);} }
function dataLunga(iso){ try{return new Date(iso).toLocaleDateString("it-IT",{day:"2-digit",month:"short",year:"numeric"});}catch(e){return "";} }
function scaduto(s){ return !!s && String(s).slice(0,10) < oggi(); }
function pulisci(html){
  var d=document.createElement("div"); d.innerHTML=html;
  d.querySelectorAll("script,style,iframe,object,embed,link,meta,form").forEach(function(n){n.remove();});
  d.querySelectorAll("*").forEach(function(n){
    for(var i=n.attributes.length-1;i>=0;i--){
      var a=n.attributes[i].name, v=n.attributes[i].value||"";
      if(a.indexOf("on")===0) n.removeAttribute(a);
      else if((a==="href"||a==="src")&&/^\s*(javascript|data):/i.test(v)) n.removeAttribute(a);
    }
  });
  d.querySelectorAll("table").forEach(function(t){
    if(t.parentNode&&t.parentNode.className==="tbl")return;
    var w=document.createElement("div"); w.className="tbl"; t.parentNode.insertBefore(w,t); w.appendChild(t);
  });
  d.querySelectorAll("a[href]").forEach(function(a){a.target="_blank"; a.rel="noopener noreferrer";});
  return d.innerHTML;
}
function rendi(node,testo){
  if(window.marked&&typeof window.marked.parse==="function"){
    try{ node.innerHTML=pulisci(window.marked.parse(testo,{headerIds:false,mangle:false})); return; }catch(e){}
  }
  node.textContent=testo;
}
function piano(md){ var t=document.createElement("div"); t.innerHTML=pulisci(window.marked?window.marked.parse(md):md);
  return (t.textContent||"").replace(/\s+/g," ").trim(); }
/* una barra per annullare l'ultima eliminazione: senza, un tocco di troppo perde un dato */
var annullaT=null;
function annulla(msg,azione){
  var v=document.querySelector(".annulla"); if(v)v.remove();
  clearTimeout(annullaT);
  var b=el("div","annulla"); b.appendChild(el("span",null,msg));

  };
  b.appendChild(t);
  var x=el("button",null,"×"); x.setAttribute("aria-label","Chiudi"); x.onclick=function(){b.remove();};
  b.appendChild(x);
  document.body.appendChild(b);
  annullaT=setTimeout(function(){ b.remove(); },12000);
}
function pill(chiave){
  var s=STATI[chiave]||STATI.aperto, p=el("span","pill "+s[1]);
  p.appendChild(el("i","dot")); p.appendChild(document.createTextNode(s[0])); return p;

/* ===================== sessione ===================== */
function turniLeggeri(){
  return turni.slice(-14).map(function(t){return {role:t.role,content:String(t.content).slice(0,9000)};});
}
function salvaSessione(){
  try{
    if(!turni.length){ localStorage.removeItem(KEY); }
    else localStorage.setItem(KEY,JSON.stringify({turni:turniLeggeri(),modo:modo,ts:Date.now()}));
  }catch(e){}
  salvaSessioneDb();
}
/* la stessa conversazione anche sugli altri dispositivi: sotto data/users/me, che resta privato */
var VIA="data/users/me/sessione";
async function salvaSessioneDb(){
  if(!db||!canWrite)return;
  try{
    if(!turni.length){ await db.doc(VIA).delete(); return; }
    await db.doc(VIA).set({turni:turniLeggeri(),modo:modo,ts:Date.now()});
  }catch(e){}
}
async function leggiSessioneDb(){
  if(!db)return null;
  try{
    var g=await db.doc(VIA).get(); if(!g.exists)return null;
    var v=g.data()||{};
    if(!v.turni||!v.turni.length)return null;
    if(Date.now()-(v.ts||0)>1000*60*60*24*10)return null;
    return {turni:v.turni,modo:v.modo,ts:v.ts||0};
  }catch(e){ return null; }
}
function leggiSessione(){
  try{
    var r=localStorage.getItem(KEY); if(!r)return null;
    var s=JSON.parse(r); if(!s||!s.turni||!s.turni.length)return null;
    if(Date.now()-(s.ts||0)>1000*60*60*24*10){ localStorage.removeItem(KEY); return null; }
    return s;
  }catch(e){ return null; }
}

/* ===================== voce ===================== */
var puoLeggere=("speechSynthesis" in window), vocIt=null;
function trovaVoce(){ if(!puoLeggere)return; var v=window.speechSynthesis.getVoices()||[];
  vocIt=v.filter(function(x){return /^it/i.test(x.lang);})[0]||null; }
if(puoLeggere){ trovaVoce(); window.speechSynthesis.onvoiceschanged=trovaVoce; }
function leggi(testo,btn){
  if(!puoLeggere)return;
  var ss=window.speechSynthesis;
  if(ss.speaking){ ss.cancel(); document.querySelectorAll(".leggi").forEach(function(b){b.textContent="Ascolta";}); return; }
  var p=piano(testo); if(!p)return;
  var u=new SpeechSynthesisUtterance(p);
  u.lang="it-IT"; if(vocIt)u.voice=vocIt; u.rate=1.04;
  u.onend=u.onerror=function(){ if(btn)btn.textContent="Ascolta"; };
  if(btn)btn.textContent="Ferma"; ss.speak(u);
}

/* ===================== dati derivati ===================== */
function statoDi(s){ return STATI[s&&s.stato]?s.stato:"aperto"; }
function apertiImp(){ return impegni.filter(function(i){return !i.fatto;})
  .sort(function(a,b){var x=a.scadenza||"9999",y=b.scadenza||"9999";return x<y?-1:x>y?1:0;}); }
/* un impegno appartiene al caso per id; il titolo resta solo come ripiego per le righe vecchie */
function impDi(s){ if(!s)return [];
  return impegni.filter(function(i){ return i.casoId?(i.casoId===s.id):(i.scheda===s.titolo); }); }
function casoDi(i){ return schede.filter(function(s){
  return i.casoId?(s.id===i.casoId):(s.titolo===i.scheda); })[0]; }
/* lo score guarda solo i casi aperti e in lavorazione: altrimenti i chiusi lo falsano per sempre */
function impAttivi(){ return impegni.filter(function(i){
  var s=casoDi(i); return !s||statoDi(s)!=="risolto"; }); }
function aggiornaBadge(){
  var n=apertiImp().length, b=document.getElementById("bdg");
  b.hidden=!n; b.textContent=n;
  b.className="badge"+(apertiImp().some(function(i){return scaduto(i.scadenza);})?" late":"");
}
function settimane(n){
  var out=[], d=new Date(); d.setHours(0,0,0,0);
  d.setDate(d.getDate()-((d.getDay()+6)%7));           /* lunedì di questa settimana */
  for(var k=n-1;k>=0;k--){
    var a=new Date(d); a.setDate(a.getDate()-7*k);
    var b=new Date(a); b.setDate(b.getDate()+7);
    out.push({da:a,a:b,n:0,et:a.toLocaleDateString("it-IT",{day:"2-digit",month:"2-digit"})});
  }
  return out;
}
function chiusiPerSettimana(){
  var w=settimane(8);
  impegni.forEach(function(i){
    if(!i.fatto||!i.chiuso)return;
    var t=new Date(i.chiuso).getTime(); if(isNaN(t))return;
    for(var k=0;k<w.length;k++) if(t>=w[k].da.getTime()&&t<w[k].a.getTime()){ w[k].n++; break; }
  });
  return w;
}

  var attivi=impAttivi();

  var scad=attivi.filter(function(i){return !i.fatto&&scaduto(i.scadenza);}).length;

  tile("Segnati",c.aperto,"Aperto","st-aperto");
  tile("In lavorazione",c.corso,"In corso","st-corso");
  tile("Risolti",c.risolto,"Risolto","st-risolto");
  tile("Scaduti",scad,scad?"Impegni oltre la data":"Nessuno oltre la data",scad?"st-scaduto":null);
  plancia.appendChild(k);

  sh.appendChild(el("p",null,"Quota di impegni chiusi sui casi aperti e in lavorazione; i casi risolti non entrano nel conto. Non misura se il problema è risolto: misura se quello che hai deciso di fare è stato fatto."));

  var sb=el("div","pb");
  if(!tot){
    var e0=el("div","empty"); e0.appendChild(el("p","Nessun impegno aperto. Archivia una conversazione e le azioni con una data finiscono qui."));
    sb.appendChild(e0);
  }else{

    sc.appendChild(el("div","leg",chiusi+" impegni chiusi su "+tot+" nei casi ancora aperti"+(scad?" · "+scad+" oltre la data concordata":"")));
    sb.appendChild(sc);
    var m=el("div","meter"); var mi=el("i"); m.appendChild(mi); sb.appendChild(m); riempi(mi,perc,animaPlancia);
  }
  sp.appendChild(sb); plancia.appendChild(sp);

  /* andamento */
  var w=chiusiPerSettimana(), somma=w.reduce(function(a,b){return a+b.n;},0);
  var ap=el("div","panel");
  var ah=el("div","ph"); ah.appendChild(el("h2",null,"Impegni chiusi per settimana"));
  ah.appendChild(el("p",null,"Ultime otto settimane. Una riga piatta a zero con casi aperti è il segnale che il follow-up si è fermato."));
  ap.appendChild(ah);
  var ab=el("div","pb");
  if(!somma){
    var e1=el("div","empty"); e1.appendChild(el("p","Ancora nessun impegno chiuso. Spunta il primo dalla lista degli aperti."));

  }else{
    ab.appendChild(grafico(w));

    tb.onclick=function(){ tabellaVisibile=!tabellaVisibile; disegnaPlancia(); };

      w.forEach(function(x){ var r=el("tr"); r.appendChild(el("td",null,x.et));

  var cp=el("div","panel");

  if(!schede.length){

      try{ await downloads.save({filename:"gestione-gruppi-"+oggi()+".md",data:testoExport()}); be.textContent="Esportato"; }
      catch(e){ be.textContent=(e&&e.code==="declined")?"Esporta i dati":"Non riesco"; }
      finally{ setTimeout(function(){be.disabled=false; if(be.textContent!=="Esporta i dati")be.textContent="Esporta i dati";},1800); }
    };
    pie.appendChild(be);
  }
  if(mcp){ var bd=el("button",null,"Diario"); bd.onclick=sheetDiario; pie.appendChild(bd); }
  if(pie.childNodes.length)plancia.appendChild(pie);

  animaPlancia=false;
  if(scrollPrec)mainEl.scrollTop=scrollPrec;

/* tutto quello che c'è dentro, in un file da tenere fuori da qui */
function testoExport(){
  var L=["# Gestione gruppi — esportazione del "+dataLunga(new Date().toISOString()),""];
  if(profilo){
    L.push("## Il mio contesto","");
    PROF.forEach(function(f){ var v=(profilo[f[0]]||"").trim(); if(v)L.push("**"+f[1]+".** "+v,""); });
  }
  var ord={aperto:0,corso:1,risolto:2};
  L.push("## Casi","");
  if(!schede.length)L.push("_Nessuno._","");
  schede.slice().sort(function(a,b){return ord[statoDi(a)]-ord[statoDi(b)];}).forEach(function(s){
    L.push("### "+(s.titolo||"Senza nome")+" — "+(STATI[statoDi(s)]||STATI.aperto)[0].toLowerCase());
    L.push("");
    if(s.stadioCodice)L.push("- Stadio: "+s.stadioCodice);
    if(s.sicurezzaLivello)L.push("- Sicurezza psicologica: "+s.sicurezzaLivello);
    if((s.scarf||[]).length)L.push("- Bisogni sotto pressione: "+s.scarf.join(", "));
    if(s.aggiornata)L.push("- Aggiornato: "+dataLunga(s.aggiornata));
    L.push("");
    CAMPI.forEach(function(f){ var v=(s[f[0]]||"").trim(); if(v)L.push("**"+f[1]+".** "+v,""); });
    var mi=impDi(s);
    L.push("**Impegni.**");
    if(!mi.length)L.push("- _nessuno_");
    mi.forEach(function(i){
      L.push("- ["+(i.fatto?"x":" ")+"] "+(i.testo||"")+(i.chi?" — "+i.chi:"")+
        (i.scadenza?" — entro "+i.scadenza:"")+(i.fatto&&i.chiuso?" (chiuso "+dataIt(i.chiuso)+")":""));
    });
    L.push("");
  });
  var orfani=impegni.filter(function(i){ return !casoDi(i); });
  if(orfani.length){
    L.push("## Impegni senza caso","");
    orfani.forEach(function(i){ L.push("- ["+(i.fatto?"x":" ")+"] "+(i.testo||"")+(i.chi?" — "+i.chi:"")+(i.scadenza?" — entro "+i.scadenza:"")); });
    L.push("");
  }
  return L.join("\n");
}

function grafico(w){
  var W=680,H=150, L=26,R=6,T=16,B=22, iw=W-L-R, ih=H-T-B;
  var max=Math.max.apply(null,w.map(function(x){return x.n;})), top=Math.max(1,max);
  var bw=iw/w.length, bar=Math.min(34,bw-8);
  var wrap=el("div","chartwrap"+(animaPlancia?"":" statico"));
  var tip=el("div","tip"), tipT=null; wrap.appendChild(tip);
  var s=sv("svg",{class:"chart",viewBox:"0 0 "+W+" "+H,role:"img",
    "aria-label":"Impegni chiusi per settimana nelle ultime otto settimane"});
  var defs=sv("defs"), gr=sv("linearGradient",{id:"gBar",x1:"0",y1:"0",x2:"0",y2:"1"});
  gr.appendChild(sv("stop",{offset:"0","stop-color":"var(--viz)","stop-opacity":"1"}));
  gr.appendChild(sv("stop",{offset:"1","stop-color":"var(--viz)","stop-opacity":".72"}));
  defs.appendChild(gr); s.appendChild(defs);
  [0,.5,1].forEach(function(f){
    var y=T+ih-ih*f;
    s.appendChild(sv("line",{class:"gl",x1:L,x2:W-R,y1:y,y2:y}));
    var tx=sv("text",{class:"tick",x:L-6,y:y+3,"text-anchor":"end"}); tx.textContent=Math.round(top*f); s.appendChild(tx);
  });
  w.forEach(function(x,k){
    var cx=L+bw*k+bw/2, h=x.n/top*ih, y=T+ih-h;
    if(x.n>0){
      s.appendChild(sv("rect",{class:"barOmbra",x:cx-bar/2+1.5,y:y+2,width:bar,height:Math.max(h,3),rx:4,style:"--i:"+k}));
      s.appendChild(sv("rect",{class:"bar",x:cx-bar/2,y:y,width:bar,height:Math.max(h,3),rx:4,style:"--i:"+k}));
    }
    var et=sv("text",{class:"tick",x:cx,y:H-7,"text-anchor":"middle"}); et.textContent=x.et; s.appendChild(et);
    if(x.n===max&&max>0){ var vl=sv("text",{class:"vlab",x:cx,y:y-5,"text-anchor":"middle"}); vl.textContent=x.n; s.appendChild(vl); }
    var hit=sv("rect",{class:"hit",x:L+bw*k,y:T,width:bw,height:ih});
    function mostraTip(){
      tip.textContent=x.n+(x.n===1?" impegno chiuso":" impegni chiusi")+" · settimana dal "+x.et;
      tip.style.left=(cx/W*100)+"%"; tip.style.top=(y/H*100)+"%"; tip.style.opacity="1";
    }
    function nascondiTip(){ tip.style.opacity="0"; }
    hit.addEventListener("mouseenter",mostraTip);
    hit.addEventListener("mouseleave",nascondiTip);
    /* al tocco mouseenter non arriva: il dato va letto anche col dito */
    hit.addEventListener("pointerdown",function(ev){
      if(ev.pointerType==="mouse")return;
      mostraTip(); clearTimeout(tipT); tipT=setTimeout(nascondiTip,2600);
    });
    s.appendChild(hit);
  });
  wrap.appendChild(s);
  return wrap;
}

  var idx=STADI.map(function(x){return x[0];}).indexOf(String(s.stadioCodice||"").toLowerCase());
  var st=el("div","steps");
  STADI.forEach(function(x,k){ var i=el("i"); if(idx>=0&&k<idx)i.className="on"; if(k===idx)i.className="cur"; st.appendChild(i); });

  else sn.appendChild(el("em",null,"non stabilito"));
  c1.appendChild(sn); g.appendChild(c1);
  /* sicurezza */
  var c2=el("div"); c2.appendChild(el("div","lab","Sicurezza psicologica"));
  var liv=String(s.sicurezzaLivello||"").toLowerCase();
  var sw=el("div","sic "+(["bassa","media","alta"].indexOf(liv)>=0?liv:""));
  var bars=el("div","bars"); bars.appendChild(el("i")); bars.appendChild(el("i")); bars.appendChild(el("i"));
  sw.appendChild(bars);
  sw.appendChild(el("span",null,liv==="bassa"?"Bassa":liv==="media"?"Media":liv==="alta"?"Alta":"Non stabilita"));
  c2.appendChild(sw);
  if(liv==="bassa") c2.appendChild(el("div","u","Qui si interviene prima di tutto il resto."));
  g.appendChild(c2);
  d.appendChild(g);

  /* SCARF */
  var hot=Array.isArray(s.scarf)?s.scarf.map(function(x){return String(x).toLowerCase();}):[];
  var c3=el("div"); c3.appendChild(el("div","lab","Bisogni sotto pressione"));

    sf.appendChild(b);
  });
  c3.appendChild(sf); d.appendChild(c3);

  /* impegni */
  var mine=impDi(s), ch=mine.filter(function(i){return i.fatto;}).length;
  var pr=el("div","prog"); pr.style.marginTop="12px";
  if(mine.length){
    var m=el("div","meter"); var mi=el("i"); m.appendChild(mi);
    pr.appendChild(m); riempi(mi,Math.round(ch/mine.length*100),animaPlancia);
    var next=mine.filter(function(i){return !i.fatto&&i.scadenza;}).sort(function(a,b){return a.scadenza<b.scadenza?-1:1;})[0];
    var txt=ch+" di "+mine.length+" impegni";
    pr.appendChild(el("span","num",txt));
    d.appendChild(pr);
    if(next){
      var nx=el("div","prog"); nx.style.marginTop="7px";

    }
  }else pr.appendChild(el("span",null,"Nessun impegno collegato")), d.appendChild(pr);

  /* azioni */
  var r=el("div","row"); r.style.marginTop="12px";

    r.appendChild(lk);
  }
  if(canWrite){
    var st2=statoDi(s);
    if(st2!=="corso"){ var b1=el("button",null,"Metti in lavorazione"); b1.onclick=function(){cambiaStato(s,"corso",b1);}; r.appendChild(b1); }
    if(st2!=="risolto"){ var b2=el("button",null,"Segna risolto"); b2.onclick=function(){cambiaStato(s,"risolto",b2);}; r.appendChild(b2); }
    if(st2!=="aperto"){ var b3=el("button",null,"Riapri"); b3.onclick=function(){cambiaStato(s,"aperto",b3);}; r.appendChild(b3); }
  }
  d.appendChild(r);
  return d;
}
async function cambiaStato(s,nuovo,btn){
  btn.disabled=true; var old=btn.textContent; btn.textContent="…";
  try{ await db.doc("schede/"+s.id).update({stato:nuovo,aggiornata:new Date().toISOString()}); diarioDopoStato(s,nuovo); }
  catch(e){ btn.disabled=false; btn.textContent=old; }
}
function testoScheda(s){
  var r=CAMPI.map(function(f){ var v=(s[f[0]]||"").trim(); return v?(f[1]+": "+v):""; }).filter(Boolean);
  if(Array.isArray(s.scarf)&&s.scarf.length) r.push("Bisogni sotto pressione: "+s.scarf.join(", "));
  r.push("Stato del caso: "+(STATI[statoDi(s)]||STATI.aperto)[0]);
  return r.join("\n");
}

async function invia(testoDato){
  if(inCorso)return;
  var testo=(testoDato!=null?testoDato:box.value).trim();
  if(!testo)return;
  setVista("parla");
  if(!sample){
    flow.appendChild(el("div","err","Questa pagina parla con Claude solo quando è aperta dentro Claude. Aprila dalla tua galleria degli artifact."));
    scrolla(); return;
  }
  ripresa=null;
  var daInviare=testo;
  if(allegata){
    daInviare="Caso salvato in precedenza, intitolato "+allegata.titolo+":\n\n"+allegata.testo+"\n\n---\n\n"+testo;
    allegata=null; mostraAllegata();
  }
  if(testoDato==null){ box.value=""; autoAlza(); }
  turnoMio(testo);
  turni.push({role:"user",content:daInviare});
  if(turni.length>22) turni=turni.slice(turni.length-22);
  if(turni[0].role!=="user") turni.shift();
  inCorso=true; bSend.disabled=true; bSend.textContent="…";
  var v=turnoSuo(); ctl=new AbortController();
  try{ await caricaContestoDiario(false); }catch(e){}
  var ultimo=turni.length-1;
  var input=[{role:"user",content:ISTR+contesto()}].concat(turni.map(function(t,i){
    return (i===ultimo&&t.role==="user")?{role:"user",content:t.content+MODO[modo]}:t;
  }));
  try{
    var r=await sample(input,{cache:false,signal:ctl.signal,modelTier:(modo==="scritto"?"complex":"default"),
      onText:function(u){ rendi(v.corpo,u.text); scrolla(); }});
    rendi(v.corpo,r.text);
    turni.push({role:"assistant",content:r.text});
    azioni(v,r.text); salvaSessione();
    if(r.truncated) errore(v,"La risposta si è interrotta per lunghezza. Chiedi una sezione per volta.");
  }catch(e){
    var cod=(e&&e.code)||"upstream_error";
    if(e&&e.text){ rendi(v.corpo,e.text); turni.push({role:"assistant",content:e.text}); azioni(v,e.text); salvaSessione(); }
    else { v.corpo.innerHTML=""; try{v.stop.remove();}catch(x){} }
    if(cod!=="cancelled") errore(v,SPIEGA[cod]||SPIEGA.upstream_error);
    else if(!e.text) v.turno.remove();
  }finally{ inCorso=false; bSend.disabled=false; bSend.textContent="Invia"; ctl=null; scrolla(); }
}

  var p=(r&&r.payload!==undefined)?r.payload:null;

    try{ p=JSON.parse(r.content[0].text); }catch(e){ p=r.content[0].text; }

function deB64(b){

async function dLista(parentId,extra){

/* ---------- testo delle note ---------- */
function nomeSicuro(t){
  return String(t||"Senza nome").replace(/[\\\/:*?"<>|#^\[\]]/g," ").replace(/\s+/g," ").trim().slice(0,70)||"Senza nome";
}
function nomeNota(s){

  return "Caso - "+nomeSicuro(s.titolo)+(dup?" ("+String(s.id).slice(0,4)+")":"");

function lnk(s){ return "[["+nomeNota(s)+"]]"; }
function schedaPerTitolo(t){ return schede.filter(function(x){ return x.titolo===t; })[0]; }
function testoNota(s){
  var L=[], imps=impDi(s);
  L.push("---","tipo: caso","caso_id: "+s.id,"stato: "+statoDi(s),
    "stadio: "+(s.stadioCodice||""),"sicurezza: "+(s.sicurezzaLivello||""),
    "scarf: ["+((s.scarf||[]).join(", "))+"]",
    "aggiornata: "+new Date().toISOString(),
    "tags: [bejelith, lavoro, caso-team]","---");
  L.push("# "+(s.titolo||"Senza nome"),"");
  L.push("Nota generata da Gestione gruppi. Puoi cambiare `stato` (aperto, corso, risolto) e spuntare gli impegni: l'app li rilegge alla prossima sincronizzazione. Vedi anche [[Bejelith - Indice]].","");
  CAMPI.forEach(function(f){
    var v=(s[f[0]]||"").trim();
    if(v){ L.push("## "+f[1],v,""); }
  });
  L.push("## Impegni");
  if(!imps.length)L.push("_Nessun impegno registrato._");
  imps.forEach(function(i){
    L.push("- ["+(i.fatto?"x":" ")+"] "+(i.testo||"")+(i.chi?" — "+i.chi:"")+(i.scadenza?" — entro "+i.scadenza:"")+" <!--imp:"+i.id+"-->");
  });

function leggiNota(txt){
  txt=String(txt).replace(/^﻿/,"").replace(/\r\n/g,"\n");
  var m=/^---[ \t]*\n([\s\S]*?)\n---/.exec(txt), fm={};
  if(m){
    m[1].split("\n").forEach(function(r){
      var k=/^([A-Za-z_][\w-]*):[ \t]*(.*)$/.exec(r);
      if(k)fm[k[1]]=k[2].trim();
    });
  }
  var corpo=m?txt.slice(m[0].length):txt, chk={}, re=/^[ \t]*-[ \t]*\[([ xX])\][^\n]*?<!--imp:([^>\s]+?)\s*-->/gm, x;
  while((x=re.exec(corpo)))chk[x[2]]=(x[1]!==" ");
  return {fm:fm,corpo:corpo,chk:chk};
}
function pulisciNota(t){
  return String(t).replace(/\r\n/g,"\n").replace(/^﻿/,"").replace(/^---[ \t]*\n[\s\S]*?\n---[ \t]*\n?/,"")
    .replace(/\[\[([^\]|]*)(\|[^\]]*)?\]\]/g,"$1").trim();
}
function testoLog(voci){
  var L=["---","tags: [bejelith, log, gestione-gruppi]","---","# Gestione gruppi — Log","",
    "Storico degli eventi dell'app Gestione gruppi. Vedi anche [[Bejelith - Indice]]."], cur="";
  voci.forEach(function(v){
    var g=giorno(v.ts);
    if(g!==cur){
      cur=g; var p=g.split("-");
      L.push("","## "+new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString("it-IT",{day:"numeric",month:"long",year:"numeric"}),"");
    }
    L.push("- "+new Date(v.ts).toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"})+" · "+v.t);
  });
  return L.join("\n")+"\n";
}

/* ---------- app -> diario ---------- */
function impronta(t){ var h=5381,i=0; for(;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))|0; return String(h>>>0); }
function urlFile(f){ return (f&&f.viewUrl)||("https://drive.google.com/file/d/"+((f&&f.id)||"")+"/view"); }
async function scriviNota(s){
  var testo=testoNota(s), imp=impronta(testo);
  if(s.nota&&s.nota.fileId&&s.nota.impronta===imp){ tr("nota invariata, non riscritta: "+s.nota.fileId); return; }

    contentMimeType:"text/markdown",disableConversionToGoogleType:true});
  if(!f||!f.id)throw {code:"upstream_error"};
  var vecchio=s.nota&&s.nota.fileId;
  var nuova={fileId:f.id,modificata:f.modifiedTime||new Date().toISOString(),url:urlFile(f),impronta:imp};
  await db.doc("schede/"+s.id).update({nota:nuova});
  s.nota=nuova;
  tr("nota salvata nel database: "+f.id);
  if(vecchio&&vecchio!==f.id){ try{ await dcall("trash_file",{fileId:vecchio}); }catch(e){} }
}
async function scriviLog(){
  var nuove=logCoda.slice();
  if(!nuove.length)return;
  var ref=db.doc("diario/log"), snap=await ref.get(), cur=snap.exists?(snap.data()||{}):{};
  var voci=(cur.voci||[]).concat(nuove).slice(-300);
  var f=await dcall("create_file",{title:"Gestione gruppi - Log.md",parentId:ID_CASI,textContent:testoLog(voci),
    contentMimeType:"text/markdown",disableConversionToGoogleType:true});
  if(!f||!f.id)throw {code:"upstream_error"};
  await ref.set({voci:voci,fileId:f.id,url:urlFile(f),aggiornato:new Date().toISOString()});
  logCoda.splice(0,nuove.length);
  if(cur.fileId&&cur.fileId!==f.id){ try{ await dcall("trash_file",{fileId:cur.fileId}); }catch(e){} }
}
function registra(testo){
  logCoda.push({ts:new Date().toISOString(),t:testo});

}
function pianifica(k){

}
async function svuotaCoda(){
  if(inCoda){ codaT=setTimeout(svuotaCoda,1500); return; }
  inCoda=true;
  var chiavi=Object.keys(codaN), k=0;
  codaN={};
  tr("coda: "+(chiavi.join(",")||"vuota")+" | schede in memoria "+schede.length);
  try{
    for(k=0;k<chiavi.length;k++){
      var c=chiavi[k];

      var s=schede.filter(function(x){ return x.id===c; })[0];

/* ---------- diario -> app ---------- */
async function sincronizza(){
  if(!mcp||!db||sincInCorso)return;
  sincInCorso=true; dStato={ok:null,msg:"Sincronizzo…",ultimo:dStato.ultimo}; segnaStato();
  try{
    for(var w=0;w<40&&!dbPronto;w++)await pausa(250);
    await pausa(500);
    tr("sync: canWrite="+canWrite+" db="+(!!db)+" mcp="+(!!mcp)+" schede="+schede.length+" dbPronto="+dbPronto);
    if(canWrite){
      schede.forEach(function(s){ if(!s.nota)codaN[s.id]=1; });
      if(logCoda.length)codaN["__log"]=1;
    }
    var daScrivere=Object.keys(codaN).length, nCasi=schede.length;
    clearTimeout(codaT);
    while(inCoda)await pausa(300);
    var scrittoOk=await svuotaCoda(), errW=scrittoOk?"":dStato.msg;
    var files=await dLista(ID_CASI,"mimeType != 'application/vnd.google-apps.folder'");
    var perId={}; files.forEach(function(f){ perId[f.id]=f; });
    var cambi=0;
    for(var a=0;a<schede.length;a++){
      var s=schede[a];
      if(!s.nota||!s.nota.fileId)continue;
      var f=perId[s.nota.fileId];
      if(!f||!(String(f.modifiedTime)>String(s.nota.modificata)))continue;
      var n=leggiNota(await leggiFile(f.id)), cm=[];
      var st=String(n.fm.stato||"").toLowerCase().replace(/["']/g,"");
      if(canWrite){
        if(STATI[st]&&st!==statoDi(s)){
          await db.doc("schede/"+s.id).update({stato:st,aggiornata:new Date().toISOString()});
          cm.push("stato "+STATI[st][0].toLowerCase());
        }
        var imps=impDi(s);
        for(var b=0;b<imps.length;b++){
          var i=imps[b], nf=n.chk[i.id];
          if(nf===undefined||nf===!!i.fatto)continue;
          await db.doc("impegni/"+i.id).update(nf?{fatto:true,chiuso:new Date().toISOString()}:{fatto:false});
          cm.push((nf?"chiuso: ":"riaperto: ")+(i.testo||""));
        }
        var nuova={fileId:s.nota.fileId,modificata:f.modifiedTime,url:s.nota.url||f.viewUrl||""};
        await db.doc("schede/"+s.id).update({nota:nuova});
        s.nota=nuova;
        if(cm.length){ registra("Dal diario, caso «"+s.titolo+"»: "+cm.join("; ")); cambi++; }
      }
    }
    await cercaDaImportare(perId);
    ultimoSync=Date.now();
    dStato={ok:scrittoOk,msg:"Sincronizzato alle "+oraIt()+" · casi "+nCasi+", note da scrivere "+daScrivere+(canWrite?"":", sola lettura")+(cambi?" · "+cambi+(cambi===1?" caso aggiornato":" casi aggiornati")+" dal diario":"")+"."+(scrittoOk?"":" Scrittura sul diario NON riuscita: "+errW),ultimo:ultimoSync};
  }catch(e){
    tr("errore sync: "+((e&&e.code)||"")+" "+String((e&&e.message)||e).slice(0,120));
    dStato={ok:false,msg:dErr(e),ultimo:dStato.ultimo};
  }finally{ sincInCorso=false; segnaStato(); }
}
async function cercaDaImportare(perId){
  /* solo dentro le due cartelle del vault: una ricerca su tutto il Drive pescava file non pertinenti
     e ne scaricava il contenuto intero */
  var trovati=[], visti={};
  for(var p=0;p<2;p++){
    var cart=p===0?ID_CASI:ID_DIARIO;
    try{
      var res=await dcall("search_files",{query:"parentId = '"+cart+"' and fullText contains 'caso-team' and trashed = false",
        excludeContentSnippets:true,pageSize:25});
      ((res&&res.files)||[]).forEach(function(f){ if(f&&f.id&&!visti[f.id]){ visti[f.id]=1; trovati.push(f); } });
    }catch(e){ tr("ricerca in "+cart+" non riuscita: "+((e&&e.code)||"errore")); }
  }
  var notaIds={}; schede.forEach(function(s){ if(s.nota&&s.nota.fileId)notaIds[s.nota.fileId]=1; });
  var gia=(dPref.trattate||[]);
  var out=[];
  var cand=trovati.filter(function(f){
    return !notaIds[f.id]&&gia.indexOf(f.id)<0&&!/^Caso - /.test(f.title||"")&&!/^Gestione gruppi - Log/.test(f.title||"");
  }).slice(0,4);
  for(var k=0;k<cand.length;k++){
    var t=await leggiFile(cand[k].id), n=leggiNota(t);
    if(n.fm.caso_id)continue;
    out.push({id:cand[k].id,title:String(cand[k].title||"").replace(/\.md$/,""),url:urlFile(cand[k]),testo:pulisciNota(t)});
  }
  daImportare=out; aggiornaBadgeD();
}
async function caricaContestoDiario(forza){

  try{
    var fs=await dLista(ID_DIARIO,"mimeType = 'text/markdown'");
    fs.sort(function(a,b){ return a.title<b.title?1:a.title>b.title?-1:0; });
    var parti=[];
    for(var k=0;k<Math.min(3,fs.length);k++){
      parti.push("[Nota del "+String(fs[k].title).replace(/\.md$/,"")+"]\n"+pulisciNota(await leggiFile(fs[k].id)).slice(0,2200));
    }

}

  rw.appendChild(bs);
  var bl=el("a",null,"Apri la cartella"); bl.href="https://drive.google.com/drive/folders/"+ID_CASI; bl.target="_blank"; bl.rel="noopener noreferrer";
  bl.style.cssText="appearance:none;border:1px solid var(--line);color:var(--fg);font:inherit;font-size:11px;font-weight:600;padding:4px 9px;border-radius:6px;text-decoration:none";
  rw.appendChild(bl);
  s.p.appendChild(rw);

  var lb=document.createElement("label"); lb.className="pick"; lb.style.marginTop="12px";
  var ck=document.createElement("input"); ck.type="checkbox"; ck.checked=usaCtx();
  var tx=el("div","g");
  tx.appendChild(el("span",null,"Usa le ultime note del diario come contesto per il consulente"));
  tx.appendChild(el("div","u","Spento per impostazione predefinita. Con questa spunta, le ultime tre note del diario — anche quelle personali — vengono inviate a Claude a ogni messaggio."));
  ck.onchange=async function(){
    dPref=Object.assign({},dPref,{usaContesto:ck.checked});
    if(!ck.checked){ ctxD=""; }
    try{ if(canWrite)await db.doc("profilo/diario").set(dPref); }catch(e){}
    if(ck.checked)caricaContestoDiario(true);
  };
  lb.appendChild(ck); lb.appendChild(tx); s.p.appendChild(lb);

  s.p.appendChild(el("h3",null,"Note pronte da importare"));
  s.p.appendChild(el("p","sub","Una nota con il tag caso-team (e senza caso_id), nel diario o nella cartella Gestione gruppi, può diventare un caso."));
  if(!daImportare.length){
    var e0=el("div","empty"); e0.appendChild(el("p",null,"Nessuna nota in attesa."));
    s.p.appendChild(e0);
  }
  daImportare.forEach(function(n){
    var c=el("div","card"); c.appendChild(el("div","t",n.title));
    c.appendChild(el("div","p",n.testo.slice(0,240)));
    var r=el("div","row");
    var bi=el("button",null,"Importa come caso");
    bi.disabled=!canWrite||!sample;
    bi.onclick=function(){ s.back.remove(); sheetArchivia("",{titolo:n.title,testo:n.testo,fileId:n.id}); };
    var bx=el("button","del","Ignora");
    bx.onclick=function(){ segnaTrattata(n.id); c.remove(); };
    r.appendChild(bi); r.appendChild(bx); c.appendChild(r); s.p.appendChild(c);
  });
  if(dTraccia.length){
    s.p.appendChild(el("h3",null,"Traccia"));
    var pre=el("pre",null,dTraccia.join("\n"));
    pre.style.cssText="font-size:10.5px;white-space:pre-wrap;word-break:break-all;color:var(--muted);max-height:180px;overflow:auto;margin:0";
    s.p.appendChild(pre);
  }
  s.fine();
}

(async function(){
  var c=window.claude;
  if(!c||!c.use){ hint.textContent="Aperta fuori da Claude: puoi leggere la pagina, non parlarci."; return; }
  try{ sample=await c.use("sample"); }catch(e){ sample=null; }
  if(!sample) hint.textContent="Questa visualizzazione non raggiunge Claude. Apri la pagina dalla tua galleria degli artifact.";
  try{ downloads=await c.use("downloads"); }catch(e){ downloads=null; }
  try{ mcp=await c.use("mcp"); }catch(e){ mcp=null; }
  var user=null; try{ user=await c.use("user"); }catch(e){}
  canWrite = user ? (user.can ? (user.can("data.write")!==false) : (user.canEdit?user.canEdit():false)) : false;
  try{ db=await c.use("db"); }catch(e){ db=null; }
  if(!db){ if(vista==="plancia")disegnaPlancia(); return; }
  var t1=setTimeout(function(){},10000);
  try{
    db.collection("schede").orderBy("aggiornata","desc").limit(200).onSnapshot(function(snap){
      clearTimeout(t1); dbPronto=true;
      schede=snap.docs.map(function(d){ var v=Object.assign({},d.data()||{}); v.id=d.id; return v; });
      tronco.schede=snap.docs.length>=200;
      pianificaPlancia();
    },function(){ clearTimeout(t1); dbPronto=true; });
    db.collection("impegni").orderBy("creato","desc").limit(600).onSnapshot(function(snap){
      impegni=snap.docs.map(function(d){ var v=Object.assign({},d.data()||{}); v.id=d.id; return v; });
      tronco.impegni=snap.docs.length>=600;
      aggiornaBadge();
      if(vista==="plancia")pianificaPlancia(); else if(!turni.length)home();
    },function(){});
    db.doc("profilo/mio").onSnapshot(function(snap){
      profilo=snap.exists?(snap.data()||null):null; if(vista==="parla"&&!turni.length)home();
    },function(){});
  }catch(e){ clearTimeout(t1); db=null; }
  /* la conversazione lasciata a metà su un altro dispositivo */
  try{
    var sdb=await leggiSessioneDb();
    if(sdb&&!turni.length&&(!ripresa||sdb.ts>ripresa.ts)){ ripresa=sdb; if(vista==="parla")home(); }
  }catch(e){}
  diarioAvvia();
})();
