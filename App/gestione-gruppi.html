<title>Gestione gruppi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<style>
/* Layout: due viste — la conversazione (una colonna, testata fissa, console in basso) e la plancia (KPI, andamento, casi). */
:root{
  --bg:#f1f2ef; --surface:#fbfbf9; --surface-2:#e7e9e4; --fg:#16181b; --muted:#5b6066;
  --line:#d3d6d0; --line-soft:#e4e6e1; --accent:#9c5410; --accent-ink:#fff; --signal:#0e635c; --warn:#8a3312;
  --viz:#2a78d6; --track:#dfe2dc;
  --good:#0ca30c; --attesa:#fab219; --serio:#ec835a; --critico:#d03b3b;
  --font-ui:"Archivo","Helvetica Neue",Arial,sans-serif;
  --font-read:"Source Serif 4",Georgia,"Times New Roman",serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14161a; --surface:#1c1f24; --surface-2:#262a30; --fg:#e9e7e2; --muted:#9ba1a8;
  --line:#2e3238; --line-soft:#262a30; --accent:#e5962e; --accent-ink:#17181a; --signal:#4fb3a7; --warn:#e0795a;
  --viz:#3987e5; --track:#2e3238;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#14161a; --surface:#1c1f24; --surface-2:#262a30; --fg:#e9e7e2; --muted:#9ba1a8;
  --line:#2e3238; --line-soft:#262a30; --accent:#e5962e; --accent-ink:#17181a; --signal:#4fb3a7; --warn:#e0795a;
  --viz:#3987e5; --track:#2e3238;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);display:flex;flex-direction:column;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{width:100%;max-width:820px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line);flex:none}
header .wrap{padding-block:9px;display:flex;align-items:center;gap:9px}
.mark{font-weight:700;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
.mark span{display:block;font-size:9.5px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:1px}
.spacer{flex:1}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--bg);flex:none}
.seg button{appearance:none;border:0;background:transparent;color:var(--muted);font:inherit;font-size:11.5px;font-weight:600;
  padding:6px 10px;cursor:pointer;letter-spacing:.02em;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.ico{appearance:none;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;font-size:12px;font-weight:700;
  padding:6px 10px;border-radius:7px;cursor:pointer;flex:none;white-space:nowrap}
.ico:hover{border-color:var(--accent)}
.badge{display:inline-block;min-width:16px;margin-left:5px;padding:0 4px;border-radius:9px;background:var(--accent);
  color:var(--accent-ink);font-size:9.5px;font-weight:700;line-height:15px;text-align:center;vertical-align:1px}
.badge.late{background:var(--critico);color:#fff}
button:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

main{flex:1;overflow-y:auto;overscroll-behavior:contain}
main .wrap{padding-block:16px 10px;display:flex;flex-direction:column;gap:16px}
.num{font-variant-numeric:tabular-nums}

/* ---------- stati: pastiglia con puntino + parola, mai colore da solo ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:2px 9px 2px 7px;
  font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:2px;flex:none}
.st-aperto .dot{background:var(--serio)} .st-aperto{border-color:var(--serio)}
.st-corso .dot{background:var(--attesa)} .st-corso{border-color:var(--attesa)}
.st-risolto .dot{background:var(--good)} .st-risolto{border-color:var(--good)}
.st-scaduto .dot{background:var(--critico)} .st-scaduto{border-color:var(--critico)}

/* ---------- plancia ---------- */
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px}
.tile{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:11px 12px}
.tile .k{font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.tile .v{font-size:27px;font-weight:700;line-height:1;letter-spacing:-.02em}
.tile .u{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.3}

.panel{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.panel>.ph{padding:11px 13px 9px;border-bottom:1px solid var(--line-soft)}
.panel>.ph h2{font-family:var(--font-read);font-size:16px;font-weight:600;margin:0;letter-spacing:-.01em}
.panel>.ph p{font-size:11.5px;color:var(--muted);margin:3px 0 0;line-height:1.4}
.panel>.pb{padding:13px}

.score{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.score .big{font-size:46px;font-weight:700;line-height:.92;letter-spacing:-.03em;font-family:var(--font-ui)}
.score .big i{font-style:normal;font-size:20px;font-weight:600;color:var(--muted);margin-left:2px}
.score .leg{font-size:12px;color:var(--muted);line-height:1.45;flex:1;min-width:150px}
.meter{height:8px;border-radius:4px;background:var(--track);overflow:hidden;margin-top:11px}
.meter i{display:block;height:100%;background:var(--viz);border-radius:4px}

.caso{border-top:1px solid var(--line-soft);padding:13px}
.caso:first-child{border-top:0}
.caso .ct{display:flex;align-items:flex-start;gap:9px;flex-wrap:wrap;margin-bottom:10px}
.caso .ct b{font-family:var(--font-read);font-size:16px;font-weight:600;letter-spacing:-.01em;flex:1;min-width:0}
.caso .cd{font-family:var(--font-read);font-size:13.5px;line-height:1.5;color:var(--muted);margin:0 0 11px}
.caso .u{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.35}

.lab{font-size:9px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:12px}

/* Tuckman: cinque passi, quello corrente marcato */
.steps{display:flex;gap:3px;margin-bottom:5px}
.steps i{flex:1;height:5px;border-radius:2px;background:var(--track)}
.steps i.on{background:var(--viz)}
.steps i.cur{background:var(--accent)}
.stepn{font-size:12.5px;font-weight:600}
.stepn em{font-style:normal;font-weight:400;color:var(--muted)}

/* sicurezza psicologica: tre tacche + parola */
.sic{display:flex;align-items:center;gap:8px}
.sic .bars{display:flex;gap:3px}
.sic .bars i{width:16px;height:9px;border-radius:2px;background:var(--track)}
.sic.bassa .bars i:nth-child(1){background:var(--critico)}
.sic.media .bars i:nth-child(1),.sic.media .bars i:nth-child(2){background:var(--attesa)}
.sic.alta .bars i{background:var(--good)}
.sic span{font-size:12.5px;font-weight:600}

/* SCARF */
.scarf{display:flex;flex-wrap:wrap;gap:5px}
.scarf b{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:6px;padding:3px 7px;
  font-size:10.5px;font-weight:600;letter-spacing:.02em;color:var(--muted)}
.scarf b.hot{border-color:var(--critico);color:var(--fg)}
.scarf b .dot{background:var(--track)}
.scarf b.hot .dot{background:var(--critico)}

.prog{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--muted)}
.prog .meter{flex:1;margin-top:0}
.caso .row{margin-top:11px}

/* grafico */
.chartwrap{position:relative}
svg.chart{display:block;width:100%;height:auto}
.gl{stroke:var(--line-soft);stroke-width:1}
.bar{fill:var(--viz)}
.tick{fill:var(--muted);font-size:9.5px;font-family:var(--font-ui);letter-spacing:.04em}
.vlab{fill:var(--fg);font-size:10.5px;font-weight:700;font-family:var(--font-ui)}
.tip{position:absolute;pointer-events:none;background:var(--fg);color:var(--bg);font-size:11px;font-weight:600;
  padding:5px 8px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-130%);opacity:0;transition:opacity .1s}
.hit{fill:transparent;cursor:default}
table.data{border-collapse:collapse;font-size:12px;width:100%}
table.data th,table.data td{border:1px solid var(--line-soft);padding:5px 8px;text-align:left}
table.data th{background:var(--surface-2);font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
table.data td.n{text-align:right;font-variant-numeric:tabular-nums}
.tbtn{appearance:none;border:0;background:transparent;color:var(--accent);font:inherit;font-size:11px;font-weight:700;
  padding:0;cursor:pointer;margin-top:9px}

/* ---------- conversazione ---------- */
.resume{border:1px solid var(--line);border-left:3px solid var(--signal);border-radius:9px;padding:10px 12px;background:var(--surface)}
.resume p{margin:0 0 8px;font-size:13px;line-height:1.45;color:var(--muted)}
.imp{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-bottom:1px solid var(--line-soft)}
.imp:last-child{border-bottom:0}
.imp .tick2{appearance:none;flex:none;width:19px;height:19px;margin-top:1px;border:1.5px solid var(--line);border-radius:5px;
  background:transparent;cursor:pointer;color:var(--good);font-size:12px;font-weight:700;line-height:16px;padding:0}
.imp .tick2:hover{border-color:var(--good)}
.imp .tx{flex:1;min-width:0;font-size:13.5px;line-height:1.4}
.imp .me{display:block;margin-top:2px;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.imp .me.late{color:var(--critico);font-weight:700}
.imp .x{appearance:none;border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:15px;line-height:1;padding:0 2px;flex:none}

.intro h1{font-family:var(--font-read);font-weight:600;font-size:clamp(21px,5.4vw,27px);line-height:1.2;margin:0 0 8px;
  text-wrap:balance;letter-spacing:-.015em}
.intro p{font-family:var(--font-read);font-size:15.5px;line-height:1.55;color:var(--muted);margin:0 0 4px;max-width:58ch}
.note{border-left:2px solid var(--signal);padding:2px 0 2px 11px;margin:14px 0 0}
.note p{font-size:13.5px;line-height:1.5;color:var(--muted);margin:0;font-family:var(--font-ui)}
.kicker{font-size:9.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin:18px 0 9px}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:7px}
.chip{appearance:none;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;
  padding:9px 11px;border-radius:9px;cursor:pointer;min-width:0}
.chip:hover{border-color:var(--accent)}
.chip b{display:block;font-size:12.5px;font-weight:600;margin-bottom:2px}
.chip i{display:block;font-style:normal;font-size:11px;line-height:1.35;color:var(--muted)}

.turn{min-width:0}
.who{font-size:9.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;
  display:flex;align-items:center;gap:8px}
.who button{appearance:none;border:1px solid var(--line);background:transparent;color:var(--muted);font:inherit;font-size:10px;
  font-weight:600;padding:2px 7px;border-radius:5px;cursor:pointer}
.mine .body{background:var(--surface-2);border-radius:10px;padding:10px 13px;font-size:14.5px;line-height:1.5;white-space:pre-wrap;
  word-break:break-word}
.said{font-family:var(--font-read);font-size:16px;line-height:1.6}
.said>*{margin:0 0 .72em}
.said>*:last-child{margin-bottom:0}
.said h2{font-family:var(--font-ui);font-size:12.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:var(--accent);margin:1.5em 0 .5em;padding-bottom:4px;border-bottom:1px solid var(--line)}
.said h1{font-family:var(--font-ui);font-size:17px;font-weight:700;margin:1.1em 0 .5em;letter-spacing:-.01em}
.said h3{font-family:var(--font-ui);font-size:13.5px;font-weight:700;margin:1.2em 0 .35em}
.said h2:first-child,.said h1:first-child{margin-top:0}
.said strong{font-weight:600}
.said ul,.said ol{padding-left:1.15em}
.said li{margin-bottom:.3em}
.said code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.86em;background:var(--surface-2);padding:1px 4px;border-radius:4px}
.said blockquote{margin-left:0;border-left:2px solid var(--accent);padding-left:12px;color:var(--muted)}
.said hr{border:0;border-top:1px solid var(--line);margin:1.3em 0}
.tbl{overflow-x:auto;margin:0 0 .72em}
.said table{border-collapse:collapse;font-family:var(--font-ui);font-size:12.5px;min-width:100%}
.said th,.said td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
.said th{background:var(--surface-2);font-weight:600;font-size:11px;letter-spacing:.03em;text-transform:uppercase}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
.acts button{appearance:none;border:1px solid var(--line);background:transparent;color:var(--muted);font:inherit;font-size:11px;
  font-weight:600;padding:4px 8px;border-radius:6px;cursor:pointer}
.acts button:hover{border-color:var(--accent);color:var(--fg)}
.acts button.pri{border-color:var(--accent);color:var(--fg)}
.thinking{font-size:13px;color:var(--muted);font-style:italic}
.err{border-left:2px solid var(--critico);padding-left:11px;font-size:13.5px;line-height:1.5;color:var(--muted);margin-top:10px}

footer{flex:none;background:var(--surface);border-top:1px solid var(--line)}
footer .wrap{padding-block:9px 11px}
.attached{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--signal);font-weight:600;margin-bottom:7px}
.attached button{appearance:none;border:0;background:transparent;color:var(--muted);cursor:pointer;font:inherit;font-size:14px;line-height:1;padding:0}
.console{display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;min-width:0;resize:none;font:inherit;font-size:15px;line-height:1.45;color:var(--fg);background:var(--bg);
  border:1px solid var(--line);border-radius:9px;padding:9px 11px;max-height:34vh}
textarea::placeholder{color:var(--muted)}
.send{appearance:none;border:0;background:var(--accent);color:var(--accent-ink);font:inherit;font-size:12.5px;font-weight:700;
  padding:10px 14px;border-radius:9px;cursor:pointer;flex:none}
.send[disabled]{opacity:.45;cursor:default}
.hint{font-size:10.5px;color:var(--muted);margin-top:7px;line-height:1.4}

.sheet{position:fixed;inset:0;z-index:20;background:rgba(10,11,13,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--surface);width:100%;max-width:820px;max-height:88%;overflow-y:auto;border-radius:14px 14px 0 0;
  border-top:1px solid var(--line);
  padding:16px max(16px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
.sheet h2{font-size:12.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;margin:0 0 3px}
.sheet h3{font-size:10px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin:20px 0 8px}
.sheet .sub{font-size:12.5px;color:var(--muted);margin:0 0 14px;line-height:1.45}
.menu button{display:block;width:100%;text-align:left;appearance:none;border:0;border-bottom:1px solid var(--line);
  background:transparent;color:var(--fg);font:inherit;font-size:14.5px;font-weight:600;padding:13px 2px;cursor:pointer}
.menu button:last-child{border-bottom:0}
.menu button small{display:block;font-size:11.5px;font-weight:400;color:var(--muted);margin-top:2px}
.card{border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-bottom:7px;background:var(--bg)}
.card .t{font-size:13.5px;font-weight:600;margin-bottom:2px}
.card .m{font-size:10.5px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-bottom:7px}
.card .p{font-size:12.5px;color:var(--muted);line-height:1.45;max-height:4.5em;overflow:hidden;margin-bottom:9px}
.row{display:flex;gap:6px;flex-wrap:wrap}
.row button{appearance:none;border:1px solid var(--line);background:transparent;color:var(--fg);font:inherit;font-size:11px;
  font-weight:600;padding:4px 9px;border-radius:6px;cursor:pointer}
.row button:hover{border-color:var(--accent)}
.row .del{color:var(--warn)}
.empty{border:1px dashed var(--line);border-radius:9px;padding:16px;text-align:center}
.empty p{font-size:13px;color:var(--muted);margin:0;line-height:1.5}
.fld{margin-bottom:11px}
.fld label{display:block;font-size:10px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.fld textarea,.fld input,.fld select{width:100%;font:inherit;font-size:13.5px;line-height:1.45;padding:8px 10px;border:1px solid var(--line);
  border-radius:8px;background:var(--bg);color:var(--fg);max-height:none;resize:vertical}
.pri-b{appearance:none;border:0;background:var(--accent);color:var(--accent-ink);font:inherit;font-size:12.5px;font-weight:700;
  padding:9px 14px;border-radius:8px;cursor:pointer}
.pri-b[disabled]{opacity:.5;cursor:default}
.sheet .close{margin-top:14px;width:100%;appearance:none;border:1px solid var(--line);background:transparent;color:var(--fg);
  font:inherit;font-size:12.5px;font-weight:600;padding:9px;border-radius:8px;cursor:pointer}
.offline{border-left:2px solid var(--critico);padding-left:11px;font-size:12.5px;color:var(--muted);line-height:1.5;margin-bottom:12px}
.pick{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin-bottom:6px;background:var(--bg)}
.pick input[type=checkbox]{margin-top:3px;flex:none;width:17px;height:17px;accent-color:var(--accent)}
.pick .g{flex:1;min-width:0}
.pick .g input[type=text]{width:100%;font:inherit;font-size:13px;padding:5px 7px;border:1px solid var(--line);border-radius:6px;
  background:var(--surface);color:var(--fg);margin-bottom:5px}
.pick .d{display:flex;gap:6px;align-items:center}
.pick .d input{font:inherit;font-size:11.5px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg)}
.pick .d span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<header>
  <div class="wrap">
    <div class="mark">Gestione gruppi<span>People management</span></div>
    <div class="spacer"></div>
    <div class="seg" role="group" aria-label="Vista">
      <button id="vParla" aria-pressed="true">Parla</button>
      <button id="vPlancia" aria-pressed="false">Plancia</button>
    </div>
    <button class="ico" id="bMenu" aria-label="Menu">Menu<span class="badge" id="bdg" hidden>0</span></button>
  </div>
</header>

<main id="main">
  <div class="wrap" id="flow"></div>
  <div class="wrap" id="plancia" hidden></div>
</main>

<footer id="piede">
  <div class="wrap">
    <div id="attached" hidden class="attached">
      <span id="attachedLbl"></span>
      <button id="attachedX" aria-label="Togli la scheda allegata">&times;</button>
    </div>
    <div class="console">
      <div class="seg" style="margin-right:0" role="group" aria-label="Registro">
        <button id="mVoce" aria-pressed="true">A voce</button>
        <button id="mScritto" aria-pressed="false">Scritto</button>
      </div>
    </div>
    <div class="console" style="margin-top:8px">
      <textarea id="box" rows="1" placeholder="Cosa è successo…" aria-label="Il tuo messaggio"></textarea>
      <button class="send" id="bSend">Invia</button>
    </div>
    <div class="hint" id="hint">Sul telefono: tocca il microfono sulla tastiera e parla.</div>
  </div>
</footer>

<script>
/* ===================== istruzioni ===================== */
var ISTR = [

/* ===================== utilità ===================== */
function el(t,c,x){var e=document.createElement(t); if(c)e.className=c; if(x!=null)e.textContent=x; return e;}
function sv(t,a){var e=document.createElementNS("http://www.w3.org/2000/svg",t);
  for(var k in a)if(a[k]!=null)e.setAttribute(k,a[k]); return e;}
function scrolla(){var m=document.getElementById("main"); m.scrollTop=m.scrollHeight;}
function oggi(){var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function dataIt(s){ if(!s)return ""; try{var p=String(s).slice(0,10).split("-");
  return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString("it-IT",{day:"2-digit",month:"short"});}catch(e){return String(s);} }
function dataLunga(iso){ try{return new Date(iso).toLocaleDateString("it-IT",{day:"2-digit",month:"short",year:"numeric"});}catch(e){return "";} }
function scaduto(s){ return !!s && String(s).slice(0,10) < oggi(); }
function pulisci(html){
  var d=document.createElement("div"); d.innerHTML=html;
  d.querySelectorAll("script,style,iframe,object,embed,link,meta,form").forEach(function(n){n.remove();});
  d.querySelectorAll("*").forEach(function(n){
    for(var i=n.attributes.length-1;i>=0;i--){
      var a=n.attributes[i].name, v=n.attributes[i].value||"";
      if(a.indexOf("on")===0) n.removeAttribute(a);
      else if((a==="href"||a==="src")&&/^\s*(javascript|data):/i.test(v)) n.removeAttribute(a);
    }
  });
  d.querySelectorAll("table").forEach(function(t){
    if(t.parentNode&&t.parentNode.className==="tbl")return;
    var w=document.createElement("div"); w.className="tbl"; t.parentNode.insertBefore(w,t); w.appendChild(t);
  });
  d.querySelectorAll("a[href]").forEach(function(a){a.target="_blank"; a.rel="noopener noreferrer";});
  return d.innerHTML;
}
function rendi(node,testo){
  if(window.marked&&typeof window.marked.parse==="function"){
    try{ node.innerHTML=pulisci(window.marked.parse(testo,{headerIds:false,mangle:false})); return; }catch(e){}
  }
  node.textContent=testo;
}
function piano(md){ var t=document.createElement("div"); t.innerHTML=pulisci(window.marked?window.marked.parse(md):md);
  return (t.textContent||"").replace(/\s+/g," ").trim(); }
function pill(chiave){
  var s=STATI[chiave]||STATI.aperto, p=el("span","pill "+s[1]);
  p.appendChild(el("i","dot")); p.appendChild(document.createTextNode(s[0])); return p;
}

function salvaSessione(){
  try{
    if(!turni.length){ localStorage.removeItem(KEY); return; }
    var p=turni.slice(-14).map(function(t){return {role:t.role,content:String(t.content).slice(0,9000)};});
    localStorage.setItem(KEY,JSON.stringify({turni:p,modo:modo,ts:Date.now()}));
  }catch(e){}
}
function leggiSessione(){
  try{
    var r=localStorage.getItem(KEY); if(!r)return null;
    var s=JSON.parse(r); if(!s||!s.turni||!s.turni.length)return null;
    if(Date.now()-(s.ts||0)>1000*60*60*24*10){ localStorage.removeItem(KEY); return null; }
    return s;
  }catch(e){ return null; }
}

/* ===================== voce ===================== */
var puoLeggere=("speechSynthesis" in window), vocIt=null;
function trovaVoce(){ if(!puoLeggere)return; var v=window.speechSynthesis.getVoices()||[];
  vocIt=v.filter(function(x){return /^it/i.test(x.lang);})[0]||null; }
if(puoLeggere){ trovaVoce(); window.speechSynthesis.onvoiceschanged=trovaVoce; }
function leggi(testo,btn){
  if(!puoLeggere)return;
  var ss=window.speechSynthesis;
  if(ss.speaking){ ss.cancel(); document.querySelectorAll(".leggi").forEach(function(b){b.textContent="Ascolta";}); return; }
  var p=piano(testo); if(!p)return;
  var u=new SpeechSynthesisUtterance(p);
  u.lang="it-IT"; if(vocIt)u.voice=vocIt; u.rate=1.04;
  u.onend=u.onerror=function(){ if(btn)btn.textContent="Ascolta"; };
  if(btn)btn.textContent="Ferma"; ss.speak(u);
}

function apertiImp(){ return impegni.filter(function(i){return !i.fatto;})

function aggiornaBadge(){
  var n=apertiImp().length, b=document.getElementById("bdg");
  b.hidden=!n; b.textContent=n;
  b.className="badge"+(apertiImp().some(function(i){return scaduto(i.scadenza);})?" late":"");
}
function settimane(n){
  var out=[], d=new Date(); d.setHours(0,0,0,0);
  d.setDate(d.getDate()-((d.getDay()+6)%7));           /* lunedì di questa settimana */
  for(var k=n-1;k>=0;k--){
    var a=new Date(d); a.setDate(a.getDate()-7*k);
    var b=new Date(a); b.setDate(b.getDate()+7);
    out.push({da:a,a:b,n:0,et:a.toLocaleDateString("it-IT",{day:"2-digit",month:"2-digit"})});
  }
  return out;
}
function chiusiPerSettimana(){
  var w=settimane(8);
  impegni.forEach(function(i){
    if(!i.fatto||!i.chiuso)return;
    var t=new Date(i.chiuso).getTime(); if(isNaN(t))return;
    for(var k=0;k<w.length;k++) if(t>=w[k].da.getTime()&&t<w[k].a.getTime()){ w[k].n++; break; }
  });
  return w;
}

function grafico(w){
  var W=680,H=150, L=26,R=6,T=16,B=22, iw=W-L-R, ih=H-T-B;
  var max=Math.max.apply(null,w.map(function(x){return x.n;})), top=Math.max(1,max);
  var bw=iw/w.length, bar=Math.min(34,bw-8);
  var wrap=el("div","chartwrap");
  var tip=el("div","tip"); wrap.appendChild(tip);
  var s=sv("svg",{class:"chart",viewBox:"0 0 "+W+" "+H,role:"img",
    "aria-label":"Impegni chiusi per settimana nelle ultime otto settimane"});
  [0,.5,1].forEach(function(f){
    var y=T+ih-ih*f;
    s.appendChild(sv("line",{class:"gl",x1:L,x2:W-R,y1:y,y2:y}));
    var tx=sv("text",{class:"tick",x:L-6,y:y+3,"text-anchor":"end"}); tx.textContent=Math.round(top*f); s.appendChild(tx);
  });
  w.forEach(function(x,k){
    var cx=L+bw*k+bw/2, h=x.n/top*ih, y=T+ih-h;
    if(x.n>0) s.appendChild(sv("rect",{class:"bar",x:cx-bar/2,y:y,width:bar,height:Math.max(h,3),rx:4}));
    var et=sv("text",{class:"tick",x:cx,y:H-7,"text-anchor":"middle"}); et.textContent=x.et; s.appendChild(et);
    if(x.n===max&&max>0){ var vl=sv("text",{class:"vlab",x:cx,y:y-5,"text-anchor":"middle"}); vl.textContent=x.n; s.appendChild(vl); }
    var hit=sv("rect",{class:"hit",x:L+bw*k,y:T,width:bw,height:ih});
    hit.addEventListener("mouseenter",function(){
      tip.textContent=x.n+(x.n===1?" impegno chiuso":" impegni chiusi")+" · settimana dal "+x.et;
      tip.style.left=(cx/W*100)+"%"; tip.style.top=(y/H*100)+"%"; tip.style.opacity="1";
    });
    hit.addEventListener("mouseleave",function(){ tip.style.opacity="0"; });
    s.appendChild(hit);
  });
  wrap.appendChild(s);
  return wrap;
}

async function invia(testoDato){
  if(inCorso)return;
  var testo=(testoDato!=null?testoDato:box.value).trim();
  if(!testo)return;
  setVista("parla");
  if(!sample){
    flow.appendChild(el("div","err","Questa pagina parla con Claude solo quando è aperta dentro Claude. Aprila dalla tua galleria degli artifact."));
    scrolla(); return;
  }
  ripresa=null;
  var daInviare=testo;
  if(allegata){
    daInviare="Caso salvato in precedenza, intitolato "+allegata.titolo+":\n\n"+allegata.testo+"\n\n---\n\n"+testo;
    allegata=null; mostraAllegata();
  }
  if(testoDato==null){ box.value=""; autoAlza(); }
  turnoMio(testo);
  turni.push({role:"user",content:daInviare});
  if(turni.length>22) turni=turni.slice(turni.length-22);
  if(turni[0].role!=="user") turni.shift();
  inCorso=true; bSend.disabled=true; bSend.textContent="…";
  var v=turnoSuo(); ctl=new AbortController();
  var ultimo=turni.length-1;
  var input=[{role:"user",content:ISTR+contesto()}].concat(turni.map(function(t,i){
    return (i===ultimo&&t.role==="user")?{role:"user",content:t.content+MODO[modo]}:t;
  }));
  try{
    var r=await sample(input,{cache:false,signal:ctl.signal,modelTier:(modo==="scritto"?"complex":"default"),
      onText:function(u){ rendi(v.corpo,u.text); scrolla(); }});
    rendi(v.corpo,r.text);
    turni.push({role:"assistant",content:r.text});
    azioni(v,r.text); salvaSessione();
    if(r.truncated) errore(v,"La risposta si è interrotta per lunghezza. Chiedi una sezione per volta.");
  }catch(e){
    var cod=(e&&e.code)||"upstream_error";
    if(e&&e.text){ rendi(v.corpo,e.text); turni.push({role:"assistant",content:e.text}); azioni(v,e.text); salvaSessione(); }
    else { v.corpo.innerHTML=""; try{v.stop.remove();}catch(x){} }
    if(cod!=="cancelled") errore(v,SPIEGA[cod]||SPIEGA.upstream_error);
    else if(!e.text) v.turno.remove();
  }finally{ inCorso=false; bSend.disabled=false; bSend.textContent="Invia"; ctl=null; scrolla(); }
}

async function sheetArchivia(testo){
  var s=sheet("Archivia","Estraggo il caso, lo stadio del gruppo, i bisogni sotto pressione e gli impegni con le date. Correggi quello che serve, poi salva.");
  var stato=el("div","offline","Sto leggendo la conversazione…"); s.p.appendChild(stato); s.fine();

  var ultimi=turni.slice(-10).map(function(t){return (t.role==="user"?"MANAGER: ":"CONSULENTE: ")+String(t.content).slice(0,7000);}).join("\n\n");
  var dati=null;
  try{
    dati=await sample.json(
      "Dalla conversazione di consulenza qui sotto, estrai una scheda. Rispondi SOLO con un oggetto JSON di questa forma, senza altro testo:\n"+
      '{"titolo":"","composizione":"","stadio":"","stadioCodice":"","sicurezza":"","sicurezzaLivello":"","scarf":[],'+
      '"diagnosi":"","interventi":"","rischi":"","impegni":[{"testo":"","chi":"","scadenza":"AAAA-MM-GG"}]}\n\n'+
      "Regole.\n"+
      "titolo: nome breve del team o della persona, con iniziali e non nomi completi (es. Reparto assemblaggio, oppure 1:1 con M.G.).\n"+
      "I campi di testo: una o due frasi, vuoti se dalla conversazione non emerge nulla di affidabile. Non inventare.\n"+
      "stadioCodice: uno solo fra forming, storming, norming, performing, adjourning, oppure stringa vuota se non si puo' stabilire. "+
      "forming = gruppo nuovo e dipendente dal capo; storming = conflitto su priorita' e metodo, sottogruppi; norming = norme condivise e fiducia iniziale; "+
      "performing = autonomia alta e conflitto sul merito; adjourning = chiusura e disimpegno. stadio: la stessa cosa in una frase in parole semplici.\n"+
      "sicurezzaLivello: bassa, media o alta, oppure stringa vuota se non si puo' stabilire. bassa = non si ammettono errori e il dissenso non arriva in riunione. "+
      "sicurezza: la stessa cosa in una frase, dicendo su cosa lo deduci.\n"+
      "scarf: elenco dei bisogni sotto pressione, scegliendo solo fra queste parole esatte: status, certezza, autonomia, appartenenza, equita. "+
      "Mettici solo quelli per cui la conversazione da' indizi concreti; elenco vuoto se non ce ne sono.\n"+
      "impegni: solo azioni concrete che qualcuno deve fare, una per voce, massimo otto. chi: iniziali o ruolo, oppure il manager. "+
      "scadenza: data AAAA-MM-GG; oggi e' "+oggi()+", quindi traduci questa settimana, entro 30 giorni, a 90 giorni in date vere; "+
      "stringa vuota se davvero non c'e' un termine.\n\nCONVERSAZIONE:\n"+ultimi,
      {modelTier:"default",cache:false});
  }catch(e){ stato.textContent=SPIEGA[(e&&e.code)||"upstream_error"]||SPIEGA.upstream_error; return; }
  if(!dati||typeof dati!=="object"){ stato.textContent="Non sono riuscito a estrarre dei dati utilizzabili."; return; }
  stato.remove();

  var dopo=s.p.children[1];
  function campo(lab,nodo){ var w=el("div","fld"); w.appendChild(el("label",null,lab)); w.appendChild(nodo);
    s.p.insertBefore(w,dopo.nextSibling); dopo=w; return nodo; }
  var ti=document.createElement("input"); ti.type="text"; ti.value=String(dati.titolo||"").slice(0,80);
  campo("Titolo del caso",ti);
  var selSt=document.createElement("select");
  selSt.appendChild(el("option",null,"— non stabilito —"));
  STADI.forEach(function(x){ var o=el("option",null,x[1]+" — "+x[2]); o.value=x[0]; selSt.appendChild(o); });
  selSt.value=String(dati.stadioCodice||"").toLowerCase();
  campo("Stadio del gruppo",selSt);
  var selSi=document.createElement("select");
  selSi.appendChild(el("option",null,"— non stabilita —"));
  [["bassa","Bassa — non si ammettono errori"],["media","Media"],["alta","Alta — il dissenso arriva in riunione"]]
    .forEach(function(x){ var o=el("option",null,x[1]); o.value=x[0]; selSi.appendChild(o); });
  selSi.value=String(dati.sicurezzaLivello||"").toLowerCase();
  campo("Sicurezza psicologica",selSi);
  var hot=Array.isArray(dati.scarf)?dati.scarf.map(function(x){return String(x).toLowerCase();}):[];
  var wsc=el("div","fld"); wsc.appendChild(el("label",null,"Bisogni sotto pressione"));
  var sfw=el("div","scarf"), caselle2={};
  SCARF.forEach(function(x){
    var lb=document.createElement("label"); lb.className="pick"; lb.style.margin="0 6px 6px 0"; lb.style.padding="6px 9px";
    var ck=document.createElement("input"); ck.type="checkbox"; ck.checked=hot.indexOf(x[0])>=0; caselle2[x[0]]=ck;
    lb.appendChild(ck); lb.appendChild(el("span",null,x[1])); sfw.appendChild(lb);
  });
  wsc.appendChild(sfw); s.p.insertBefore(wsc,dopo.nextSibling); dopo=wsc;
  var caselle={};
  CAMPI.forEach(function(f){
    var ta=document.createElement("textarea"); ta.rows=2; ta.value=String(dati[f[0]]||"");
    caselle[f[0]]=campo(f[1],ta);
  });

  var hImp=el("h3",null,"Impegni da tenere"); s.p.insertBefore(hImp,dopo.nextSibling); dopo=hImp;
  var lista=Array.isArray(dati.impegni)?dati.impegni.slice(0,8):[], righe=[];
  if(!lista.length){
    var ne=el("div","empty"); ne.appendChild(el("p","Dalla conversazione non è emerso nessun impegno con una data."));
    s.p.insertBefore(ne,dopo.nextSibling); dopo=ne;
  }
  lista.forEach(function(i){
    var w=el("div","pick");
    var ck=document.createElement("input"); ck.type="checkbox"; ck.checked=true;
    var g=el("div","g");
    var tx=document.createElement("input"); tx.type="text"; tx.value=String(i.testo||"");
    var dd=el("div","d");
    var who=document.createElement("input"); who.type="text"; who.value=String(i.chi||""); who.placeholder="chi"; who.style.maxWidth="110px";
    var dt=document.createElement("input"); dt.type="date";
    dt.value=/^\d{4}-\d{2}-\d{2}$/.test(String(i.scadenza||""))?i.scadenza:"";
    dd.appendChild(el("span",null,"entro")); dd.appendChild(dt); dd.appendChild(who);
    g.appendChild(tx); g.appendChild(dd); w.appendChild(ck); w.appendChild(g);
    s.p.insertBefore(w,dopo.nextSibling); dopo=w;
    righe.push({ck:ck,tx:tx,who:who,dt:dt});
  });

  var b=el("button","pri-b","Salva il caso e gli impegni");
  if(!canWrite){ b.disabled=true; b.textContent="Solo in lettura"; }
  b.onclick=async function(){
    b.disabled=true; b.textContent="…";
    var d={titolo:(ti.value||"Senza nome").trim(),stato:"aperto",
      stadioCodice:selSt.value||"",sicurezzaLivello:selSi.value||"",
      scarf:SCARF.filter(function(x){return caselle2[x[0]].checked;}).map(function(x){return x[0];}),
      aggiornata:new Date().toISOString(),creata:new Date().toISOString()};
    CAMPI.forEach(function(f){ d[f[0]]=caselle[f[0]].value.trim(); });
    try{
      await db.collection("schede").add(d);
      for(var k=0;k<righe.length;k++){
        var r=righe[k];
        if(!r.ck.checked||!r.tx.value.trim())continue;
        await db.collection("impegni").add({testo:r.tx.value.trim(),chi:r.who.value.trim(),
          scadenza:r.dt.value||"",fatto:false,scheda:d.titolo,creato:new Date().toISOString()});
      }
      s.back.remove(); setVista("plancia");
    }catch(e){
      b.disabled=false; b.textContent="Salva il caso e gli impegni";
      s.p.insertBefore(el("div","offline","Non è stato possibile salvare: "+((e&&e.code)||"errore")+"."),s.p.children[1]);
    }
  };
  s.p.insertBefore(b,dopo.nextSibling);
}

(async function(){
  var c=window.claude;
  if(!c||!c.use){ hint.textContent="Aperta fuori da Claude: puoi leggere la pagina, non parlarci."; return; }
  try{ sample=await c.use("sample"); }catch(e){ sample=null; }
  if(!sample) hint.textContent="Questa visualizzazione non raggiunge Claude. Apri la pagina dalla tua galleria degli artifact.";
  try{ downloads=await c.use("downloads"); }catch(e){ downloads=null; }
  var user=null; try{ user=await c.use("user"); }catch(e){}
  canWrite = user ? (user.can ? (user.can("data.write")!==false) : (user.canEdit?user.canEdit():false)) : false;
  try{ db=await c.use("db"); }catch(e){ db=null; }
  if(!db){ if(vista==="plancia")disegnaPlancia(); return; }
  var t1=setTimeout(function(){},10000);
  try{
    db.collection("schede").orderBy("aggiornata","desc").limit(80).onSnapshot(function(snap){
      clearTimeout(t1); dbPronto=true;
      schede=snap.docs.map(function(d){ var v=d.data()||{}; v.id=d.id; return v; });
      if(vista==="plancia")disegnaPlancia();
    },function(){ clearTimeout(t1); dbPronto=true; });
    db.collection("impegni").limit(400).onSnapshot(function(snap){
      impegni=snap.docs.map(function(d){ var v=d.data()||{}; v.id=d.id; return v; });
      aggiornaBadge();
      if(vista==="plancia")disegnaPlancia(); else if(!turni.length)home();
    },function(){});
    db.doc("profilo/mio").onSnapshot(function(snap){
      profilo=snap.exists?(snap.data()||null):null; if(vista==="parla"&&!turni.length)home();
    },function(){});
  }catch(e){ clearTimeout(t1); db=null; }
})();
